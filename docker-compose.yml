services:
  db:
    image: postgres:15-alpine
    container_name: agnos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agnos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: agnos_backend
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/agnos_db?sslmode=disable
      - PORT=8081
    depends_on:
      - db
    expose:
      - "8081"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: agnos_nginx
    ports:
      - "3000:80"   # เปลี่ยนจาก 8080:80 เป็น 3000:80
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  pgdata: